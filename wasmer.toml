[package]
entrypoint = "run"

[dependencies]
"php/php-eh" = "=8.3.404-beta.4"
"wasmer/static-web-server" = "*"

[fs]
"/app" = "app"
"/config" = "config"

[[command]]
name = "serve-static"
module = "wasmer/static-web-server:webserver"
runner = "wasi"
[command.annotations.wasi]
main-args = [
  "--root",
  "/app",
]

[[command]]
name = "run"
module = "php/php-eh:php"
runner = "wasi"

[command.annotations.wasi]
main-args = [
  "-t",
  "/app",
  "-S",
  "localhost:8080",
  "-d",
  "memory_limit=512M",
  "-d",
  "max_execution_time=600",
  "-d",
  "max_input_time=600",
  "-d",
  "max_input_vars=5000",
  "-d",
  "upload_max_filesize=1024M",
  "-d",
  "post_max_size=1024M",
]
env = ["PHPRC=/config/", "PHP_INI_SCAN_DIR=/config"]
