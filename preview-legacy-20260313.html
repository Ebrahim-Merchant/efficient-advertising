<!DOCTYPE html>
<html lang="en-AE">
<head>
<meta charset="UTF-8" />
<title>Preview: Legacy Corporate (March 2023 Backup)</title>
<meta content='IE=edge' http-equiv='X-UA-Compatible'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<!-- CSS Links pointing to legacy theme directory -->
<link rel="stylesheet" href="wp-content/themes/Efficient-backup-20260313/css/bootstrap.min.css">
<link rel="stylesheet" href="wp-content/themes/Efficient-backup-20260313/css/animate.css">
<link rel="stylesheet" href="wp-content/themes/Efficient-backup-20260313/css/style.css">
<link rel="stylesheet" href="wp-content/themes/Efficient-backup-20260313/css/font-awesome.min.css">

<style>
/* Extracted Legacy Header Styles */
.logtophead { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
.ea-toprow-left .logo img { height: 60px; }
.ea-toprow-phone { color: #16a34a !important; font-weight: 700; font-size: 14px; text-decoration: none !important; }

/* Legacy Homebaner Styles from index.php */
.homebaner {
    height: 600px;
    background: #f0f0f0;
    position: relative;
    overflow: hidden;
}
.carousel-static-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}
.folowup {
    position: absolute;
    left: 10%;
    bottom: 0;
    z-index: 10;
    height: 90%;
}
.folowup img {
    height: 100%;
}
.contentleft {
    position: absolute;
    right: 15%;
    top: 30%;
    z-index: 20;
    text-align: center;
}
.tisda {
    font-size: 48px;
    font-weight: 800;
    color: #1e2d60;
    text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
}
.btn.contus {
    background: #a51c3c;
    color: #fff;
    padding: 12px 30px;
    border-radius: 5px;
    font-weight: 700;
    margin-top: 20px;
    border: none;
}
.product-preview-img {
    position: absolute;
    left: 40%;
    top: 20%;
    z-index: 5;
    width: 400px;
    transform: rotate(-5deg);
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}
</style>
</head>
<body>

<div id="header">
   <nav class="navbar navbar-inverse">
      <div class="container">
        <div class="logtophead">
          <div class="ea-toprow-left">
            <div class="logo"><img src="wp-content/themes/Efficient-backup-20260313/img/logo.png" alt="logo" /></div>
            <h3 style="margin-left:20px; color:#555;">You think it, We print it</h3>
          </div>
          <div class="ea-toprow-right">
            <a href="#" class="ea-toprow-phone">+971 52 796 6265</a>
          </div>
        </div>
      </div>
   </nav>
</div>

<div class="homebaner">
    <!-- Static Background -->
    <img class="carousel-static-bg" src="wp-content/uploads/2022/06/bak-1.png" alt="">
    
    <!-- Static Man -->
    <div class="folowup">
        <img src="wp-content/themes/Efficient/img/banda.png" alt="Person">
    </div>

    <!-- Product Layer (Mocking Carousel) -->
    <img class="product-preview-img" src="wp-content/uploads/2022/03/Step-Repeat-Backdrop-2.jpg" alt="Product">

    <!-- Content -->
    <div class="contentleft">
        <span class="tisda">LEGACY PREVIEW</span><br>
        <button class="btn contus"><i class="fa fa-arrow-circle-right"></i> Contact Us</button>
    </div>
</div>

<div class="container" style="padding: 100px 0; text-align:center;">
    <h2 style="color:#1e2d60;">This is the "Legacy Corporate" (March 2023) Theme Preview</h2>
    <p>Notice the different layout (Person on left, Green phone number, Burgundy buttons).</p>
</div>

</body>
</html>
